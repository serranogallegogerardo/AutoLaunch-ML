# Workflow de la versión 2 (.github/workflows/ci-cd.yml en la rama v2-sla-uci).
# El trabajo de publicación solo corre en main y requiere los secretos HF_TOKEN y PULSEML_API_KEY.
name: PulseML MLOps CI/CD v2

on:
  push:
    branches: ["main", "v2-sla-uci"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar dataset UCI y verificar hash
        run: python scripts/00_descargar_datos.py fd184bbfd62329cfe093e99da2ea7071905f2ead91900b448eb2635870821bef
      - name: Preparar datos por incidente
        run: python scripts/01_perfil.py
      - name: Entrenar con compuerta de calidad
        run: python prototipo/model/train.py
      - name: Pruebas automáticas
        run: python -m pytest prototipo/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: prototipo/model/artifacts

  deploy:
    needs: train-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: prototipo/model/artifacts
      - run: pip install huggingface_hub
      - name: Publicar API y tablero en Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PULSEML_API_KEY: ${{ secrets.PULSEML_API_KEY }}
        run: python prototipo/deploy_hf.py
